<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/mypage.css">

	<title>Emotion diary</title>
</head>

<body>
	<!-- 
    	사용자: 감정 일기에 회원 가입이 되어있는 사람
		목적: 작성한 일기를 확인하거나 AI 피드백 스타일을 설정
		핵심 행동: 일기 목록, 일기 확인, AI 스타일 설정
		정보 순서: 일기 목록 → 일기 확인, AI 스타일 설정
    -->
	<header>
		<nav class="header-nav">
			<a href="./index.html"><img src="assets/images/logo.png" alt="웃는 얼굴의 로고">감정 일기 서비스</a>
		</nav>
	</header>

	<main>
		<section class="diary-list-container">
			<h2>일기 목록</h2>

			<div class="diary-left">
				<div class="diary-list-table">
					<table class="diary-list">
						<colgroup>
							<col class="col-1">
							<col class="col-2">
							<col class="col-3">
						</colgroup>
						<thead>
							<tr>
								<th>날짜</th>
								<th>제목</th>
								<th>감정</th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td>2026.10.24</td>
								<td><a href="#">일기 제목 부분입니다.</a></td>
								<td><img src="assets/images/emoji/face_good.png" alt=""></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</section>

		<section class="setting">
			<h2>AI 피드백 설정</h2>
			<div class="ai-container">
				<div class="ai-set-main">
					<i class="bi bi-heart"></i>
					<div>
						<b>공감과 위로</b>
						<p>감정을 이해하고 따뜻한 말로 위로합니다.</p>
					</div>
				</div>
				<div class="ai-set-main">
					<i class="bi bi-chat"></i>
					<div>
						<b>말투</b>
						<p>따뜻하고 다정하게</p>
					</div>
				</div>
				<div class="ai-set-main">
					<i class="bi bi-chat-dots"></i>
					<div>
						<b>답변 길이</b>
						<p>보통-적당한 공감과 설명</p>
					</div>
				</div>
			</div>

			<!-- AI 피드백 스타일 설정 시 사용 -->
			<div class="ai-container d-none" id="aiStyleContainer">
				<div class="scroll-y">
					<div class="ai-set-main ai-set-container">
						<i class="bi bi-heart"></i>
						<div>
							<b>피드백 방식</b>
						</div>
						<div class="ai-set-items" id="feedbackItems">
							<label>
								<input type="radio" name="feedback" value="empathy">
								<b>공감과 위로</b>
								<p>감정을 이해하고 따뜻한 말로 위로합니다.</p>
								<p class="light-font">"오늘 정말 힘들었겠어요. 그런 감정이 느껴지는게 자연스러워요."</p>
							</label>
							<label>
								<input type="radio" name="feedback" value="analysis">
								<b>감정 분석</b>
								<p>일기에서 드러나는 감정과 그 원인을 정리해줍니다.</p>
								<p class="light-font">"업무에서 느낀 부담감과 타인의 평가에 대한 걱정이 나타나요."</p>
							</label>
							<label>
								<input type="radio" name="feedback" value="resolution">
								<b>해결 방법 제안</b>
								<p>상황을 개선하거나 기분을 전환할 방법을 제안합니다.</p>
								<p class="light-font">"오늘은 잠깐 휴식을 취하고, 내일 해야 할 일을 하나씩 정리해 보는 건 어떨까요?"</p>
							</label>
						</div>
					</div>
					<div class="ai-set-main ai-set-container d-none">
						<i class="bi bi-chat"></i>
						<div>
							<b>말투</b>
						</div>
						<div class="ai-set-items" id="speechItems">
							<label>
								<input type="radio" name="speech" value="kind">
								따뜻하고 다정하게
							</label>
							<label>
								<input type="radio" name="speech" value="calm">
								차분하고 담백하게
							</label>
							<label>
								<input type="radio" name="speech" value="friendly">
								친근한 친구처럼
							</label>
							<label>
								<input type="radio" name="speech" value="polite">
								차분하고 정중하게
							</label>
						</div>
					</div>
					<div class="ai-set-main ai-set-container d-none">
						<i class="bi bi-chat-dots"></i>
						<div>
							<b>답변 길이</b>
						</div>
						<div class="ai-set-items" id="lengthItems">
							<label>
								<input type="radio" name="length" value="min">
								짧게 - 핵심만 간결하게
							</label>
							<label>
								<input type="radio" name="length" value="middle">
								보통 - 적당한 설명
							</label>
							<label>
								<input type="radio" name="length" value="max">
								길게 - 자세한 분석과 설명
							</label>
						</div>
					</div>
				</div>

				<div class="prev-next-buttons">
					<button id="prevBtn">취소</button>
					<button id="nextBtn" disabled>다음</button>
				</div>
			</div>
		</section>
	</main>


	<footer>
		<p>&copy; 2026 감정 일기 서비스</p>
	</footer>

	<script src="js/script.js"></script>
</body>

</html>
